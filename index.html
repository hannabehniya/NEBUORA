<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Merge Planets</title>

<style>
*{box-sizing:border-box}

:root{
    --gold:#eab45e;
    --gold2:#ffe0a0;
    --bg:#080b12;
    --text:#f7e9d2;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
}

body{
    height:100vh;
    height:100dvh;
    padding:
        max(4px,env(safe-area-inset-top))
        max(6px,env(safe-area-inset-right))
        max(4px,env(safe-area-inset-bottom))
        max(6px,env(safe-area-inset-left));

    display:flex;
    justify-content:center;
    align-items:center;

    color:var(--text);
    font-family:Arial,sans-serif;
}

button{
    font:inherit;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

/* کل رابط و مخزن دقیقاً یک عرض دارند */
.game{
    width:min(100%,440px,calc(66.667dvh - 124px));
    max-width:440px;
    min-width:0;
    min-height:0;
    margin:0 auto;

    display:flex;
    flex-direction:column;
}

/* امتیاز، رکورد و دکمه‌ها */
.topbar{
    width:100%;
    min-width:0;
    flex:0 0 auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;

    margin:0;
    padding:0;
    direction:ltr;
}

.score-area{
    min-width:0;
    flex:1 1 auto;
    text-align:left;
    direction:ltr;
}

.label{
    color:var(--gold);
    font-size:12px;
    font-weight:bold;
    letter-spacing:4px;
}

.score{
    font-size:clamp(34px,10vw,58px);
    font-weight:bold;
    line-height:1;
    color:#f8e8d0;
    text-shadow:0 0 16px #f2bd6b25;
    font-variant-numeric:tabular-nums;
}

.best{
    margin-top:3px;
    font-size:11px;
    color:var(--gold);
    font-weight:bold;
    letter-spacing:1.5px;
    white-space:nowrap;
}

.controls{
    display:flex;
    flex:0 0 auto;
    align-items:center;
    gap:6px;
    direction:ltr;
}

.icon-button{
    width:clamp(34px,10vw,42px);
    height:clamp(34px,10vw,42px);
    flex:0 0 auto;

    border-radius:50%;
    border:1.5px solid #765a38;
    background:rgba(27,22,22,.72);
    color:var(--gold2);

    display:grid;
    place-items:center;
    padding:0;

    font-size:22px;
    cursor:pointer;

    box-shadow:inset 0 0 0 3px #e6b86c12;
}

.icon-button:active{
    transform:scale(.92);
}

/* نوار پیشرفت و سیاره بعدی */
.next-area{
    width:100%;
    min-width:0;
    flex:0 0 auto;

    display:flex;
    align-items:center;
    gap:6px;
    direction:ltr;

    margin:0 0 4px;
    padding:0;
}

.progress-track{
    flex:1 1 auto;
    min-width:0;
    height:7px;

    border-radius:20px;
    background:rgba(103,70,43,.62);
    overflow:hidden;
    border:1px solid rgba(235,179,92,.12);
}

.progress-fill{
    width:0%;
    height:100%;
    border-radius:inherit;

    background:linear-gradient(
        90deg,
        #b8793d,
        #f6c66e,
        #ffe8a4
    );

    box-shadow:0 0 9px #f2b85b80;
    transition:width .15s linear;
}

.next-box{
    width:44px;
    flex:0 0 auto;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
}

.next-label{
    color:var(--gold);
    font-size:9px;
    font-weight:bold;
    letter-spacing:2px;
}

#nextCanvas{
    width:42px;
    height:42px;
    display:block;
}

/* مخزن */
.board-wrap{
    position:relative;
    width:100%;
    max-width:100%;
    min-width:0;
    min-height:0;

    flex:0 0 auto;
    align-self:center;
    aspect-ratio:2/3;

    overflow:hidden;
    border-radius:12px;
    background:#080b12;
    border:1px solid rgba(219,166,83,.55);

    box-shadow:
        0 0 12px rgba(243,184,88,.10),
        inset 0 0 8px rgba(242,189,107,.06),
        inset 0 0 35px rgba(242,189,107,.035);
}

#gameCanvas{
    display:block;
    width:100%;
    height:100%;

    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

/* گوشی‌های باریک */
@media(max-width:360px){
    .topbar{gap:5px}
    .controls{gap:4px}

    .icon-button{
        width:34px;
        height:34px;
        font-size:20px;
    }

    .score{
        font-size:clamp(32px,10vw,40px);
    }

    .best{
        font-size:10px;
        letter-spacing:1px;
    }

    .next-area{gap:4px}
    .next-box{width:38px}

    #nextCanvas{
        width:36px;
        height:36px;
    }
}

/* گوشی‌های کوتاه */
@media(max-height:600px){
    .label{font-size:10px}

    .score{
        font-size:clamp(28px,7.5vw,42px);
    }

    .best{
        margin-top:2px;
        font-size:10px;
    }

    .next-area{margin-bottom:3px}
    .next-box{width:36px}

    .next-label{
        font-size:8px;
        letter-spacing:1.5px;
    }

    #nextCanvas{
        width:32px;
        height:32px;
    }
}

/* پنجره‌های کوتاه‌تر */
@media(max-height:480px){
    .game{
        width:min(100%,440px,calc(66.667dvh - 90px));
    }

    .topbar{gap:4px}
    .score{font-size:28px}

    .icon-button{
        width:29px;
        height:29px;
        font-size:18px;
    }

    .next-area{margin-bottom:2px}

    #nextCanvas{
        width:27px;
        height:27px;
    }
}

/* نمایش دسکتاپ */
@media(min-width:600px) and (min-height:700px){
    .label{font-size:12px}
    .score{font-size:58px}
    .best{font-size:11px}
    .next-area{margin-bottom:4px}
    .next-box{width:44px}

    #nextCanvas{
        width:42px;
        height:42px;
    }
}
</style>
</head>

<body>
<div class="game">

<header class="topbar">
    <div class="score-area">
        <div class="label">SCORE</div>
        <div class="score" id="score">0</div>
        <div class="best">BEST <span id="best">0</span></div>
    </div>

    <div class="controls">
        <button class="icon-button" id="restartTop" aria-label="شروع دوباره">↻</button>
        <button class="icon-button" id="soundButton" aria-label="صدا">♪</button>
    </div>
</header>

<div class="next-area">
    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="next-box">
        <div class="next-label">NEXT</div>
        <canvas id="nextCanvas" width="100" height="100"></canvas>
    </div>
</div>

<div class="board-wrap">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>

</div>

<script>
"use strict";

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const nextCanvas = document.getElementById("nextCanvas");
const nextCtx = nextCanvas.getContext("2d");

const W = 400;
const H = 600;

const dangerY = 105;
const floorY = 592;
const wallLeft = 16;
const wallRight = 384;

const GRAVITY = 1120;
const AIR_FRICTION = .997;
const GROUND_FRICTION = .91;
const RESTITUTION = .025;

const levels = [
    {r:15,color:"#ff5c9a",dark:"#a91f58",light:"#ffc0de",score:0,face:"wink",rock:"#e43d83"},
    {r:20,color:"#ff805f",dark:"#a83c31",light:"#ffd0ad",score:1,face:"happy",rock:"#e85a3d"},
    {r:25,color:"#ffd16b",dark:"#ad762a",light:"#fff0ad",score:2,face:"closed",rock:"#edac35"},
    {r:31,color:"#63e8cf",dark:"#147b79",light:"#c2fff0",score:3,face:"surprised",rock:"#29b9a9"},
    {r:38,color:"#46c9f4",dark:"#145c9a",light:"#b6f4ff",score:4,face:"cool",rock:"#188fc6"},
    {r:46,color:"#9a79ff",dark:"#4b2b9a",light:"#e3d5ff",score:5,face:"star",rock:"#7654dd"},
    {r:55,color:"#ff77ca",dark:"#96336f",light:"#ffd1f0",score:7,face:"sleepy",rock:"#e84baf"},
    {r:65,color:"#e9b8ff",dark:"#7544a1",light:"#fff0ff",score:9,face:"wink2",rock:"#bc83e8"},
    {r:76,color:"#f3d7a2",dark:"#78617b",light:"#fff5d5",score:12,face:"joy",rock:"#b9a0a9"},
    {r:88,color:"#f68a4d",dark:"#913e31",light:"#ffe0a0",score:15,face:"grin",rock:"#d85a35"}
];

let balls = [];
let particles = [];
let mergeEffects = [];
let popups = [];
let stars = [];

let score = 0;
let best = 0;
let bestAtStart = 0;

let gameOver = false;
let dropping = false;
let muted = true;

let aimX = W / 2;
let nextLevel = 0;
let sadPlanet = null;

let gameOverTimer = 0;
let dangerTimer = 0;
let lastTime = 0;
let gameTime = 0;
let dropCooldown = 0;
let audioContext = null;
let accumulator = 0;

let masterGain = null;
let musicTimer = null;
let musicStep = 0;
let recordCelebrated = false;
/*
 * سیستم پیشرفت بر اساس تعداد پرتاب‌ها:
 * سه پرتاب اول فقط کوچک‌ترین سیاره هستند.
 * بعد از آن سایز دوم وارد مخزن انتخاب می‌شود.
 */
let droppedBalls = 0;

/*
 * شماره پرتابی که در آن هر سایز برای اولین بار ساخته شده است.
 * اندیس 1 یعنی سیاره دوم، اندیس 2 یعنی سیاره سوم و ...
 */
let firstCreatedAtDrop = Array(6).fill(null);

/*
 * وزن انتخاب سیاره‌ها:
 * هرچه وزن بیشتر باشد، احتمال انتخاب آن سایز بیشتر است.
 * فقط شش سایز اول اجازه ورود به مخزن انتخاب را دارند.
 */
const planetWeights = [70, 25, 10, 4, 2, 1];

try {
    best = Number(localStorage.getItem("mergePlanetsBest")) || 0;
} catch(e) {
    best = 0;
}

for (let i = 0; i < 125; i++) {
    stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: .35 + Math.random() * 1.25,
        alpha: .18 + Math.random() * .56,
        phase: Math.random() * 6.28,
        speed: .4 + Math.random() * 1.3,
        twinkle: Math.random() > .82
    });
}

/* حداکثر سایزی که با توجه به پیشرفت بازی مجاز به دریافت است */
function getUnlockedMaxLevel() {
    // تا پیش از سه پرتاب، فقط کوچک‌ترین سیاره
    if (droppedBalls < 3) {
        return 0;
    }

    // پس از سه پرتاب، سایز دوم هم در دسترس قرار می‌گیرد
    let maxLevel = 1;

    /*
     * سایز سوم:
     * ابتدا باید حداقل یک سیاره سایز دوم ساخته شده باشد.
     * سپس چهار پرتاب دیگر باید انجام شود.
     */
    if (
        firstCreatedAtDrop[1] !== null &&
        droppedBalls - firstCreatedAtDrop[1] >= 4
    ) {
        maxLevel = 2;
    }

    /*
     * سایز چهارم:
     * سایز سوم ساخته شده باشد و پس از آن شش پرتاب انجام شود.
     */
    if (
        maxLevel >= 2 &&
        firstCreatedAtDrop[2] !== null &&
        droppedBalls - firstCreatedAtDrop[2] >= 6
    ) {
        maxLevel = 3;
    }

    /*
     * سایز پنجم:
     * سایز چهارم ساخته شده باشد و پس از آن هشت پرتاب انجام شود.
     */
    if (
        maxLevel >= 3 &&
        firstCreatedAtDrop[3] !== null &&
        droppedBalls - firstCreatedAtDrop[3] >= 8
    ) {
        maxLevel = 4;
    }

    /*
     * سایز ششم:
     * سایز پنجم ساخته شده باشد و پس از آن ده پرتاب انجام شود.
     */
    if (
        maxLevel >= 4 &&
        firstCreatedAtDrop[4] !== null &&
        droppedBalls - firstCreatedAtDrop[4] >= 10
    ) {
        maxLevel = 5;
    }

    return maxLevel;
}

/* انتخاب تصادفی سیاره از بین سایزهای بازشده */
function randomLevel() {
    const maxLevel = Math.min(5, getUnlockedMaxLevel());

    let totalWeight = 0;

    for (let level = 0; level <= maxLevel; level++) {
        totalWeight += planetWeights[level];
    }

    let roll = Math.random() * totalWeight;

    for (let level = 0; level <= maxLevel; level++) {
        roll -= planetWeights[level];

        if (roll < 0) {
            return level;
        }
    }

    return 0;
}

function updateUI() {
    document.getElementById("score").textContent =
        score.toLocaleString("en-US");

    document.getElementById("best").textContent =
        best.toLocaleString("en-US");

    let pct;

    if (bestAtStart > 0) {
        pct = Math.min(100, (score / bestAtStart) * 100);
    } else {
        pct = 0;
    }

    document.getElementById("progressFill").style.width = pct + "%";

    drawNextPlanet();
}

function saveBest() {
    if (score > best) {
        best = score;

        try {
            localStorage.setItem(
                "mergePlanetsBest",
                String(best)
            );
        } catch (e) {}

        document.getElementById("best").textContent =
            best.toLocaleString("en-US");

        // صدای رکورد فقط یک‌بار در هر دور بازی
        if (!recordCelebrated && score > bestAtStart) {
            recordCelebrated = true;
            playRecordSound();
        }
    }
}

/* =================================
   AUDIO ENGINE
================================= */

function ensureAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;

    if (!AC) {
        return false;
    }

    if (!audioContext) {
        audioContext = new AC();

        masterGain = audioContext.createGain();
        masterGain.gain.value = muted ? 0 : 1;

        masterGain.connect(audioContext.destination);
    }

    if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
    }

    return true;
}


/* صدای ساده سینوسی؛ برای سازگاری با کد قبلی */
function playTone(f = 440, d = 0.12, v = 0.035) {
    if (muted || !ensureAudio()) return;

    const now = audioContext.currentTime;

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(f, now);

    gain.gain.setValueAtTime(v, now);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + d
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now + d);
}


/* افکت صوتی با تغییر فرکانس */
function playEnvelopeTone(
    frequency,
    duration = 0.15,
    volume = 0.025,
    type = "sine",
    endFrequency = null
) {
    if (muted || !ensureAudio()) return;

    const now = audioContext.currentTime;

    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();

    osc.type = type;

    osc.frequency.setValueAtTime(frequency, now);

    if (endFrequency !== null) {
        osc.frequency.exponentialRampToValueAtTime(
            Math.max(1, endFrequency),
            now + duration
        );
    }

    gain.gain.setValueAtTime(0.0001, now);

    gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.025
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + duration
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start(now);
    osc.stop(now + duration + 0.03);
}


/* =================================
   DROP SOUND
   صدای رها شدن سیاره
================================= */

function playDropSound() {
    playEnvelopeTone(
        220, 0.15, 0.035, "triangle", 95
    );

    playEnvelopeTone(
        115, 0.10, 0.012, "sine", 75
    );
}


/* =================================
   POP SOUND
   صدای ادغام و ترکیدن
================================= */

function playPopSound(level = 1) {
    const frequency = 350 + level * 45;

    playEnvelopeTone(
        frequency,
        0.12,
        0.038,
        "triangle",
        frequency * 1.35
    );

    playEnvelopeTone(
        frequency * 1.8,
        0.085,
        0.016,
        "sine",
        frequency * 1.3
    );
}


/* =================================
   SCORE SOUND
   صدای گرفتن امتیاز
================================= */

function playScoreSound(points = 1) {
    const frequency = 650 + Math.min(points, 15) * 18;

    playEnvelopeTone(
        frequency,
        0.12,
        0.025,
        "sine",
        frequency * 1.22
    );

    setTimeout(() => {
        playEnvelopeTone(
            frequency * 1.3,
            0.14,
            0.021,
            "sine",
            frequency * 1.5
        );
    }, 65);
}


/* =================================
   LOSE SOUND
   صدای باخت
================================= */

function playLoseSound() {
    const notes = [
        { frequency: 330, delay: 0 },
        { frequency: 247, delay: 150 },
        { frequency: 196, delay: 310 },
        { frequency: 130, delay: 500 }
    ];

    for (const note of notes) {
        setTimeout(() => {
            playEnvelopeTone(
                note.frequency,
                0.25,
                0.035,
                "triangle",
                note.frequency * 0.78
            );
        }, note.delay);
    }
}


/* =================================
   NEW RECORD SOUND
   صدای ثبت رکورد جدید
================================= */

function playRecordSound() {
    const notes = [
        { frequency: 523.25, delay: 0 },
        { frequency: 659.25, delay: 100 },
        { frequency: 783.99, delay: 200 },
        { frequency: 1046.5, delay: 320 }
    ];

    for (const note of notes) {
        setTimeout(() => {
            playEnvelopeTone(
                note.frequency,
                0.22,
                0.032,
                "sine",
                note.frequency * 1.04
            );
        }, note.delay);
    }
}


/* =================================
   BACKGROUND MUSIC
   موسیقی فضایی ملایم و تکرارشونده
================================= */

const musicMelody = [
    261.63, 329.63, 392.00, 329.63,
    293.66, 349.23, 440.00, 349.23,
    261.63, 329.63, 392.00, 493.88,
    440.00, 392.00, 329.63, 293.66
];

const musicChords = [
    [130.81, 164.81, 196.00],
    [110.00, 146.83, 174.61],
    [123.47, 155.56, 185.00],
    [116.54, 146.83, 174.61]
];


function playMusicStep() {
    if (muted || !audioContext) return;

    const melodyFrequency =
        musicMelody[musicStep % musicMelody.length];

    // نت ملایم ملودی
    playEnvelopeTone(
        melodyFrequency,
        0.85,
        0.009,
        "sine"
    );

    // آکورد پس‌زمینه هر چهار ضرب
    if (musicStep % 4 === 0) {
        const chordIndex =
            Math.floor(musicStep / 4) % musicChords.length;

        const chord = musicChords[chordIndex];

        chord.forEach((frequency, index) => {
            playEnvelopeTone(
                frequency,
                2.15,
                index === 0 ? 0.008 : 0.0045,
                "sine"
            );
        });
    }

    musicStep++;
}


function startBackgroundMusic() {
    if (muted || musicTimer !== null) return;
    if (!ensureAudio()) return;

    musicStep = 0;

    playMusicStep();

    musicTimer = setInterval(() => {
        if (muted) {
            stopBackgroundMusic();
            return;
        }

        playMusicStep();
    }, 620);
}


function stopBackgroundMusic() {
    if (musicTimer !== null) {
        clearInterval(musicTimer);
        musicTimer = null;
    }
}

function createBall(x, y, level, vy = 0) {
    return {
        x,
        y,
        level,
        r: levels[level].r,
        vx: 0,
        vy,
        age: 0,
        merging: false,
        blinkPhase: Math.random() * 10,
        settled: false,
        mergeLock: 0
    };
}

function resetGame() {
    balls = [];
    particles = [];
    mergeEffects = [];
    popups = [];
    mergeQueue = [];

    score = 0;
    bestAtStart = best;
    recordCelebrated = false;
    gameOver = false;
    dropping = false;
    sadPlanet = null;

    gameOverTimer = 0;
    dangerTimer = 0;
    aimX = W / 2;

    // بازنشانی کامل پیشرفت سیاره‌ها
    droppedBalls = 0;
    firstCreatedAtDrop = Array(6).fill(null);

    nextLevel = randomLevel();

    dropCooldown = 0;
    accumulator = 0;

    updateUI();
}

function getPointerX(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) * (W / r.width);
}

function moveAim(e) {
    if (gameOver || dropping || sadPlanet) return;

    let x = getPointerX(e);
    let r = levels[nextLevel].r;

    aimX = Math.max(
        wallLeft + r,
        Math.min(wallRight - r, x)
    );
}

canvas.addEventListener("pointermove", moveAim);

canvas.addEventListener("pointerdown", e => {
    e.preventDefault();

    if (gameOver) {
        resetGame();
        return;
    }

    if (dropping || sadPlanet) return;

    moveAim(e);
    dropBall();
});

function dropBall() {
    if (gameOver || dropping || sadPlanet) return;

    const l = nextLevel;
    const r = levels[l].r;

    const x = Math.max(
        wallLeft + r,
        Math.min(wallRight - r, aimX)
    );

    balls.push(createBall(x, dangerY + r + 13, l, 0));

    // شمارش پرتاب موفق
    droppedBalls++;

    dropping = true;
    dropCooldown = .42;

    // سیاره بعدی با توجه به تعداد پرتاب و سایزهای بازشده انتخاب می‌شود
    nextLevel = randomLevel();

    playDropSound();
    updateUI();
}

function createParticles(x, y, color, n = 22, power = 150) {
    for (let i = 0; i < n; i++) {
        let a = Math.random() * Math.PI * 2;
        let s = 25 + Math.random() * power;

        particles.push({
            x,
            y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: .22 + Math.random() * .32,
            maxLife: .54,
            color,
            size: 1 + Math.random() * 3.2
        });
    }
}

function createMergeEffect(x, y, color, big = 1) {
    mergeEffects.push({
        x,
        y,
        color,
        radius: 3,
        alpha: 1,
        life: .32,
        maxLife: .32,
        big
    });
}

function addScore(points, x, y) {
    score += points;

    saveBest();

    popups.push({
        x,
        y,
        text: "+" + points,
        life: .78,
        maxLife: .78
    });

    updateUI();
}

let mergeQueue = [];

function requestMerge(a, b) {
    if (a.merging || b.merging) return;
    if (a.level !== b.level || a.level >= levels.length - 1) return;
    if (sadPlanet) return;
    if (a.mergeLock > 0 || b.mergeLock > 0) return;

    a.merging = true;
    b.merging = true;

    mergeQueue.push({a, b});
}

function processMerges() {
    let safety = 0;

    while (mergeQueue.length && safety++ < 30) {
        const pair = mergeQueue.shift();
        const a = pair.a;
        const b = pair.b;

        if (!balls.includes(a) || !balls.includes(b)) continue;

        const x = (a.x + b.x) / 2;
        const y = (a.y + b.y) / 2;
        const l = a.level + 1;
        const color = levels[a.level].color;

        /*
         * ثبت اولین ساخته‌شدن هر سایز.
         * این مقدار بر اساس تعداد پرتاب‌های انجام‌شده ذخیره می‌شود،
         * نه زمان سپری‌شده.
         */
        if (l >= 1 && l < 6 && firstCreatedAtDrop[l] === null) {
            firstCreatedAtDrop[l] = droppedBalls;
        }

        createMergeEffect(x, y, color, 1 + l * .08);
        createParticles(x, y, color, 26, 190);

        addScore(levels[l].score, x, y);

        balls = balls.filter(q => q !== a && q !== b);

        let nb = createBall(x, y, l, -38);
        nb.mergeLock = .13;

        balls.push(nb);

        playPopSound(l);
        playScoreSound(levels[l].score);
    }
}

function resolveCollision(a, b) {
    if (a.merging || b.merging) return;

    const dx = b.x - a.x;
    const dy = b.y - a.y;

    let dist = Math.hypot(dx, dy);
    if (dist < .0001) dist = .0001;

    const min = a.r + b.r;
    if (dist >= min) return;

    const nx = dx / dist;
    const ny = dy / dist;
    const overlap = min - dist;

    const ma = Math.pow(a.r, 3.25);
    const mb = Math.pow(b.r, 3.25);

    const ia = 1 / ma;
    const ib = 1 / mb;
    const it = ia + ib;

    const correction = Math.max(0, overlap - .015) * .82;

    a.x -= nx * correction * ia / it;
    a.y -= ny * correction * ia / it;
    b.x += nx * correction * ib / it;
    b.y += ny * correction * ib / it;

    const rvx = b.vx - a.vx;
    const rvy = b.vy - a.vy;
    const normal = rvx * nx + rvy * ny;

    if (normal < 0) {
        const j = -(1 + RESTITUTION) * normal / it;

        a.vx -= j * nx * ia;
        a.vy -= j * ny * ia;

        b.vx += j * nx * ib;
        b.vy += j * ny * ib;
    }

    const tx = -ny;
    const ty = nx;

    const tv = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty;

    let jt = -tv * .28 / it;
    const maxJ = Math.abs(normal) * .16;

    jt = Math.max(-maxJ, Math.min(maxJ, jt));

    a.vx -= jt * tx * ia;
    a.vy -= jt * ty * ia;

    b.vx += jt * tx * ib;
    b.vy += jt * ty * ib;

    if (Math.abs(ny) > .55) {
        a.vx *= .985;
        b.vx *= .985;
    }

    if (
        a.level === b.level &&
        a.age > .17 &&
        b.age > .17 &&
        Math.abs(normal) < 440
    ) {
        requestMerge(a, b);
    }
}

function moveBall(b, dt) {
    b.age += dt;

    if (b.mergeLock > 0) b.mergeLock -= dt;

    b.vy += GRAVITY * dt;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    b.vx *= Math.pow(AIR_FRICTION, dt * 60);

    const minX = wallLeft + b.r;
    const maxX = wallRight - b.r;

    if (b.x < minX) {
        b.x = minX;
        if (b.vx < 0) b.vx = 0;
    }

    if (b.x > maxX) {
        b.x = maxX;
        if (b.vx > 0) b.vx = 0;
    }

    if (b.y + b.r > floorY) {
        b.y = floorY - b.r;

        if (b.vy > 0) b.vy = -b.vy * RESTITUTION;

        b.vx *= GROUND_FRICTION;

        if (Math.abs(b.vy) < 22) b.vy = 0;
    }
}

function physicsStep(dt) {
    for (const b of balls) {
        if (!b.merging) moveBall(b, dt);
    }

    for (let pass = 0; pass < 7; pass++) {
        for (let i = 0; i < balls.length; i++) {
            for (let j = i + 1; j < balls.length; j++) {
                if (!balls[i].merging && !balls[j].merging) {
                    resolveCollision(balls[i], balls[j]);
                }
            }
        }

        for (const b of balls) {
            if (b.merging) continue;

            b.x = Math.max(
                wallLeft + b.r,
                Math.min(wallRight - b.r, b.x)
            );

            if (b.y + b.r > floorY) {
                b.y = floorY - b.r;
            }
        }
    }

    processMerges();
}

function checkGameOver(dt) {
    if (gameOver) return;

    if (sadPlanet) {
        gameOverTimer -= dt;

        if (gameOverTimer <= 0) {
            gameOver = true;
            playLoseSound();
            saveBest();
        }

        return;
    }

    let found = null;

    for (const b of balls) {
        if (b.merging) continue;

        if (b.age > 1.0 && b.y - b.r < dangerY) {
            found = b;
            break;
        }
    }

    if (found) {
        dangerTimer += dt;

        if (dangerTimer >= 1.12) {
            sadPlanet = found;
            gameOverTimer = 1.25;

            sadPlanet.vx = 0;
            sadPlanet.vy = 0;

            playTone(150, .32, .04);
        }
    } else {
        dangerTimer = Math.max(0, dangerTimer - dt * .7);
    }
}

function updateEffects(dt) {
    for (const p of particles) {
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        p.vx *= Math.pow(.94, dt * 60);
        p.vy += 45 * dt;

        p.life -= dt;
    }

    particles = particles.filter(p => p.life > 0);

    for (const e of mergeEffects) {
        e.life -= dt;
        e.radius += (180 * e.big) * dt;
        e.alpha = Math.max(0, e.life / e.maxLife);
    }

    mergeEffects = mergeEffects.filter(e => e.life > 0);

    for (const p of popups) {
        p.y -= 34 * dt;
        p.life -= dt;
    }

    popups = popups.filter(p => p.life > 0);
}

function update(dt) {
    gameTime += dt;

    if (dropCooldown > 0) {
        dropCooldown -= dt;

        if (dropCooldown <= 0) {
            dropping = false;
        }
    }

    if (sadPlanet) {
        sadPlanet.vx = 0;
        sadPlanet.vy = 0;

        checkGameOver(dt);
        updateEffects(dt);

        return;
    }

    if (!gameOver) {
        accumulator += dt;

        const fixed = 1 / 120;
        let n = 0;

        while (accumulator >= fixed && n < 8) {
            physicsStep(fixed);
            accumulator -= fixed;
            n++;
        }

        if (n >= 8) accumulator = 0;

        checkGameOver(dt);
    }

    updateEffects(dt);
}

function drawBackground() {
    const bg = ctx.createLinearGradient(0, 0, 0, H);

    bg.addColorStop(0, "#080b12");
    bg.addColorStop(.55, "#080d16");
    bg.addColorStop(1, "#090c13");

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const halo = ctx.createRadialGradient(
        W / 2, 105, 30,
        W / 2, 105, 225
    );

    halo.addColorStop(0, "rgba(237,169,83,0.15)");
    halo.addColorStop(.38, "rgba(200,128,65,0.075)");
    halo.addColorStop(.72, "rgba(160,94,47,0.025)");
    halo.addColorStop(1, "rgba(160,94,47,0)");

    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, W, H);

    const sunX = W / 2;
    const sunY = dangerY + 30;
    const sunR = 125;

    ctx.save();

    const sunGlow = ctx.createRadialGradient(
        sunX, sunY - sunR * .58, 20,
        sunX, sunY - sunR * .58, sunR * 1.35
    );

    sunGlow.addColorStop(0, "rgba(255,191,105,0.12)");
    sunGlow.addColorStop(.45, "rgba(244,168,83,0.055)");
    sunGlow.addColorStop(1, "rgba(244,168,83,0)");

    ctx.fillStyle = sunGlow;
    ctx.fillRect(
        sunX - sunR * 1.4,
        sunY - sunR * 1.5,
        sunR * 2.8,
        sunR * 1.7
    );

    ctx.beginPath();
    ctx.arc(
        sunX, sunY, sunR,
        Math.PI + .22,
        Math.PI * 2 - .22,
        false
    );

    ctx.strokeStyle = "rgba(246,190,112,0.88)";
    ctx.lineWidth = 1.9;
    ctx.shadowColor = "rgba(255,185,91,0.85)";
    ctx.shadowBlur = 19;
    ctx.stroke();

    ctx.shadowBlur = 0;

    ctx.beginPath();
    ctx.arc(
        sunX, sunY, sunR - 2,
        Math.PI + .22,
        Math.PI * 2 - .22,
        false
    );

    ctx.strokeStyle = "rgba(255,225,171,0.24)";
    ctx.lineWidth = .8;
    ctx.stroke();

    ctx.restore();

    for (const s of stars) {
        const tw = .65 + .35 * Math.sin(gameTime * s.speed + s.phase);

        ctx.globalAlpha = s.alpha * tw;
        ctx.fillStyle = "#ffd184";

        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();

        if (s.twinkle) {
            ctx.strokeStyle = "#ffcf7c";
            ctx.lineWidth = .65;

            ctx.beginPath();
            ctx.moveTo(s.x - s.r * 2.4, s.y);
            ctx.lineTo(s.x + s.r * 2.4, s.y);
            ctx.moveTo(s.x, s.y - s.r * 2.4);
            ctx.lineTo(s.x, s.y + s.r * 2.4);
            ctx.stroke();
        }
    }

    ctx.globalAlpha = 1;

    const glass = ctx.createLinearGradient(wallLeft, 0, wallRight, 0);

    glass.addColorStop(0, "rgba(9,13,22,.66)");
    glass.addColorStop(.5, "rgba(7,12,21,.56)");
    glass.addColorStop(1, "rgba(9,13,22,.66)");

    ctx.fillStyle = glass;

    ctx.beginPath();
    ctx.roundRect(
        wallLeft, dangerY,
        wallRight - wallLeft,
        floorY - dangerY,
        12
    );
    ctx.fill();

    ctx.save();

    ctx.beginPath();
    ctx.roundRect(
        wallLeft + 1, dangerY + 1,
        wallRight - wallLeft - 2,
        floorY - dangerY - 2,
        11
    );
    ctx.clip();

    const innerGlow = ctx.createRadialGradient(
        W / 2, dangerY + 4, 3,
        W / 2, dangerY + 4, 245
    );

    innerGlow.addColorStop(0, "rgba(242,174,91,0.13)");
    innerGlow.addColorStop(.22, "rgba(226,150,75,0.075)");
    innerGlow.addColorStop(.48, "rgba(190,117,61,0.035)");
    innerGlow.addColorStop(.75, "rgba(145,85,49,0.012)");
    innerGlow.addColorStop(1, "rgba(145,85,49,0)");

    ctx.fillStyle = innerGlow;
    ctx.fillRect(wallLeft, dangerY, wallRight - wallLeft, floorY - dangerY);

    const topGlow = ctx.createLinearGradient(0, dangerY, 0, dangerY + 95);

    topGlow.addColorStop(0, "rgba(255,190,105,0.10)");
    topGlow.addColorStop(.35, "rgba(255,177,92,0.035)");
    topGlow.addColorStop(1, "rgba(255,177,92,0)");

    ctx.fillStyle = topGlow;
    ctx.fillRect(wallLeft, dangerY, wallRight - wallLeft, 95);

    ctx.restore();

    ctx.strokeStyle = "rgba(244,190,112,.28)";
    ctx.lineWidth = .7;

    ctx.beginPath();
    ctx.roundRect(
        wallLeft + 1, dangerY + 1,
        wallRight - wallLeft - 2,
        floorY - dangerY - 2,
        11
    );
    ctx.stroke();

    ctx.save();

    ctx.strokeStyle = "#f1b45f";
    ctx.lineWidth = 2.6;
    ctx.shadowColor = "#f6b65e";
    ctx.shadowBlur = 5;

    ctx.beginPath();
    ctx.moveTo(wallLeft, dangerY - 10);
    ctx.lineTo(wallLeft, floorY);
    ctx.lineTo(wallRight, floorY);
    ctx.lineTo(wallRight, dangerY - 10);
    ctx.stroke();

    ctx.restore();

    ctx.save();

    ctx.setLineDash([6, 7]);

    ctx.strokeStyle = dangerTimer > 0
        ? "rgba(255,78,93,.95)"
        : "rgba(244,183,101,.56)";

    ctx.lineWidth = dangerTimer > 0 ? 2.2 : 1.1;

    ctx.beginPath();
    ctx.moveTo(wallLeft, dangerY);
    ctx.lineTo(wallRight, dangerY);
    ctx.stroke();

    ctx.restore();

    if (dangerTimer > 0) {
        ctx.fillStyle = "rgba(255,65,85,.10)";
        ctx.fillRect(wallLeft, dangerY, wallRight - wallLeft, 12);
    }
}

function drawEye(c, x, y, rx, ry, style = "open") {
    c.save();

    c.fillStyle = "#24162c";
    c.strokeStyle = "#24162c";
    c.lineCap = "round";

    if (style === "closed" || style === "wink") {
        c.lineWidth = Math.max(1.6, rx * .28);

        c.beginPath();
        c.moveTo(x - rx, y);
        c.quadraticCurveTo(x, y + ry * .7, x + rx, y);
        c.stroke();

    } else if (style === "happy") {
        c.lineWidth = Math.max(1.8, rx * .3);

        c.beginPath();
        c.arc(x, y, rx, Math.PI, Math.PI * 2);
        c.stroke();

    } else {
        c.beginPath();
        c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = "#fff9f1";

        c.beginPath();
        c.ellipse(
            x - rx * .25, y - ry * .3,
            Math.max(.8, rx * .27),
            Math.max(.8, ry * .24),
            -.3, 0, Math.PI * 2
        );
        c.fill();

        c.fillStyle = "#fff";

        c.beginPath();
        c.arc(
            x + rx * .18,
            y + ry * .17,
            Math.max(.6, rx * .10),
            0, Math.PI * 2
        );
        c.fill();
    }

    c.restore();
}

function drawFace(c, x, y, r, level, sad = false) {
    const type = levels[level].face;

    const ex = r * .32;
    const ey = y - r * .07;
    const er = Math.max(1.6, r * .17);

    c.fillStyle = "rgba(255,116,154,.7)";

    c.beginPath();
    c.ellipse(x - r * .49, y + r * .16, r * .13, r * .075, -.15, 0, Math.PI * 2);
    c.ellipse(x + r * .49, y + r * .16, r * .13, r * .075, .15, 0, Math.PI * 2);
    c.fill();

    if (sad) {
        drawEye(c, x - ex, ey, er, er * 1.1);
        drawEye(c, x + ex, ey, er, er * 1.1);

    } else if (type === "wink") {
        drawEye(c, x - ex, ey, er, er * 1.15);
        drawEye(c, x + ex, ey, er, er, "closed");

    } else if (type === "wink2") {
        drawEye(c, x - ex, ey, er, er, "closed");
        drawEye(c, x + ex, ey, er, er * 1.15);

    } else if (type === "closed" || type === "sleepy") {
        drawEye(c, x - ex, ey, er, er, "closed");
        drawEye(c, x + ex, ey, er, er, "closed");

    } else if (type === "happy") {
        drawEye(c, x - ex, ey, er, er, "happy");
        drawEye(c, x + ex, ey, er, er, "happy");

    } else if (type === "cool") {
        c.fillStyle = "#24162c";

        c.beginPath();
        c.ellipse(x - ex, ey, er * 1.25, er * .48, -.1, 0, Math.PI * 2);
        c.ellipse(x + ex, ey, er * 1.25, er * .48, .1, 0, Math.PI * 2);
        c.fill();

        c.strokeStyle = "#24162c";
        c.lineWidth = Math.max(1.5, r * .055);

        c.beginPath();
        c.moveTo(x - r * .25, y + r * .22);
        c.quadraticCurveTo(x + r * .02, y + r * .38, x + r * .26, y + r * .12);
        c.stroke();

        return;

    } else if (type === "star") {
        for (const xx of [x - ex, x + ex]) {
            c.fillStyle = "#24162c";

            c.beginPath();

            for (let i = 0; i < 10; i++) {
                let a = -Math.PI / 2 + i * Math.PI / 5;
                let rr = i % 2 ? er * .48 : er * 1.08;

                c.lineTo(
                    xx + Math.cos(a) * rr,
                    ey + Math.sin(a) * rr
                );
            }

            c.closePath();
            c.fill();
        }

    } else {
        let blink = Math.sin(gameTime * 1.4 + level * 2.4) > .997;

        drawEye(
            c, x - ex, ey, er,
            er * (type === "surprised" ? 1.35 : 1.15),
            blink ? "closed" : "open"
        );

        drawEye(
            c, x + ex, ey, er,
            er * (type === "surprised" ? 1.35 : 1.15),
            blink ? "closed" : "open"
        );
    }

    c.fillStyle = "#24162c";
    c.strokeStyle = "#24162c";
    c.lineWidth = Math.max(1.4, r * .065);
    c.lineCap = "round";

    c.beginPath();

    if (sad) {
        c.arc(x, y + r * .47, r * .2, .15, Math.PI - .15);
        c.stroke();
        return;

    } else if (type === "surprised") {
        c.beginPath();
        c.ellipse(x, y + r * .25, r * .12, r * .17, 0, 0, Math.PI * 2);
        c.fill();

    } else if (type === "grin" || type === "joy") {
        c.beginPath();
        c.ellipse(x, y + r * .25, r * .22, r * .17, 0, 0, Math.PI);
        c.fill();

        c.fillStyle = "#ff8296";

        c.beginPath();
        c.ellipse(x, y + r * .34, r * .12, r * .055, 0, 0, Math.PI * 2);
        c.fill();

    } else if (type === "sleepy") {
        c.moveTo(x - r * .17, y + r * .22);
        c.lineTo(x + r * .17, y + r * .22);
        c.stroke();

    } else if (type === "wink2") {
        c.arc(x, y + r * .16, r * .23, .15, Math.PI - .15);
        c.stroke();

    } else {
        c.arc(
            x,
            y + r * .15,
            r * (type === "star" ? .20 : .24),
            .12,
            Math.PI - .12
        );
        c.stroke();

        if (type === "happy" || type === "wink") {
            c.fillStyle = "#ff8296";

            c.beginPath();
            c.ellipse(x, y + r * .28, r * .10, r * .055, 0, 0, Math.PI * 2);
            c.fill();
        }
    }
}

function drawPlanetOn(c, x, y, level, rOverride = null, options = {}) {
    const info = levels[level];
    const r = rOverride || info.r;
    const preview = !!options.preview;
    const sad = !!options.sad;

    c.save();

    c.shadowColor = info.color;
    c.shadowBlur = preview ? 3 : Math.min(8, r * .12);

    const base = c.createRadialGradient(
        x - r * .36, y - r * .42, r * .015,
        x + r * .12, y + r * .12, r * 1.18
    );

    base.addColorStop(0, info.light);
    base.addColorStop(.22, info.color);
    base.addColorStop(.58, info.rock);
    base.addColorStop(.82, info.dark);
    base.addColorStop(1, info.dark);

    c.fillStyle = base;

    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();

    c.shadowBlur = 0;

    c.save();

    c.beginPath();
    c.arc(x, y, r * .975, 0, Math.PI * 2);
    c.clip();

    let seed = (level + 1) * 92821 + 173;

    function rand() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
    }

    const blotColors = [info.light, info.color, info.rock, info.dark];
    const blotCount = Math.max(24, Math.floor(r * 1.15));

    for (let i = 0; i < blotCount; i++) {
        const a = rand() * Math.PI * 2;
        const d = Math.sqrt(rand()) * r * .88;

        const bx = x + Math.cos(a) * d;
        const by = y + Math.sin(a) * d;

        const br = r * (.045 + rand() * .12);
        const stretch = 1.2 + rand() * 1.8;
        const rotation = rand() * Math.PI;

        c.save();
        c.translate(bx, by);
        c.rotate(rotation);

        c.globalAlpha = .22 + rand() * .24;
        c.fillStyle = blotColors[Math.floor(rand() * blotColors.length)];

        c.beginPath();
        c.moveTo(-br * stretch, 0);

        c.bezierCurveTo(
            -br * stretch, -br * .8,
            -br * .35, -br * 1.4,
            br * .25, -br
        );

        c.bezierCurveTo(
            br * 1.25, -br * .8,
            br * stretch, br * .15,
            br * .55, br * .75
        );

        c.bezierCurveTo(
            br * .1, br * 1.15,
            -br * .8, br * .75,
            -br * stretch, 0
        );

        c.fill();

        c.globalAlpha = .18;
        c.fillStyle = rand() > .5 ? info.dark : info.light;

        c.beginPath();
        c.ellipse(br * .2, -br * .1, br * .55, br * .34, -.3, 0, Math.PI * 2);
        c.fill();

        c.restore();
    }

    c.globalAlpha = 1;

    const craterCount = Math.max(7, Math.floor(r * .28));

    for (let i = 0; i < craterCount; i++) {
        const sizeRoll = rand();
        let sizeFactor;

        if (sizeRoll < .48) {
            sizeFactor = .025 + rand() * .025;
        } else if (sizeRoll < .82) {
            sizeFactor = .05 + rand() * .045;
        } else {
            sizeFactor = .09 + rand() * .055;
        }

        const cr = r * sizeFactor;
        const widthRatio = .8 + rand() * .7;
        const heightRatio = .65 + rand() * .3;

        let a, d, cx, cy;
        let validPosition = false;

        for (let attempt = 0; attempt < 50; attempt++) {
            a = rand() * Math.PI * 2;
            d = r * (.58 + rand() * .36);

            cx = x + Math.cos(a) * d;
            cy = y + Math.sin(a) * d;

            const safeX = r * .62 + cr * widthRatio * 1.25;
            const safeY = r * .47 + cr * heightRatio * 1.3;

            const dx = (cx - x) / safeX;
            const dy = (cy - y) / safeY;

            if (dx * dx + dy * dy >= 1) {
                validPosition = true;
                break;
            }
        }

        if (!validPosition) continue;

        const rotation = rand() * Math.PI;

        c.save();
        c.translate(cx, cy);
        c.rotate(rotation);

        c.globalAlpha = .65;
        c.fillStyle = info.dark;

        c.beginPath();
        c.ellipse(cr * .12, cr * .18, cr * 1.5, cr * 1.08, 0, 0, Math.PI * 2);
        c.fill();

        c.globalAlpha = .85;
        c.strokeStyle = info.light;
        c.lineWidth = Math.max(.8, r * .025);

        c.beginPath();
        c.ellipse(
            -cr * .06, -cr * .07,
            cr * 1.4, cr,
            0, Math.PI * 1.05, Math.PI * 1.9
        );
        c.stroke();

        const hole = c.createRadialGradient(
            -cr * .3, -cr * .25, cr * .05,
            0, 0, cr * 1.3
        );

        hole.addColorStop(0, "rgba(55,34,54,.88)");
        hole.addColorStop(.45, "rgba(65,40,60,.72)");
        hole.addColorStop(.78, info.dark);
        hole.addColorStop(1, info.rock);

        c.globalAlpha = .70;
        c.fillStyle = hole;

        c.beginPath();
        c.ellipse(0, 0, cr * 1.22, cr * .82, 0, 0, Math.PI * 2);
        c.fill();

        c.globalAlpha = .35;
        c.fillStyle = info.dark;

        for (let j = 0; j < 3; j++) {
            const px = (rand() - .5) * cr * 3.5;
            const py = (rand() - .5) * cr * 2.8;
            const pr = cr * (.08 + rand() * .12);

            c.beginPath();
            c.arc(px, py, pr, 0, Math.PI * 2);
            c.fill();
        }

        c.restore();
    }

    c.globalAlpha = 1;

    for (let i = 0; i < Math.floor(r * .9); i++) {
        const a = rand() * Math.PI * 2;
        const d = Math.sqrt(rand()) * r * .88;

        const px = x + Math.cos(a) * d;
        const py = y + Math.sin(a) * d;
        const dot = r * (.008 + rand() * .025);

        c.globalAlpha = .12 + rand() * .20;
        c.fillStyle = rand() > .5 ? info.light : info.dark;

        c.beginPath();
        c.ellipse(px, py, dot * 1.5, dot, rand() * 3, 0, Math.PI * 2);
        c.fill();
    }

    c.globalAlpha = 1;
    c.restore();

    const shine = c.createRadialGradient(
        x - r * .34, y - r * .42, 0,
        x - r * .25, y - r * .28, r * .88
    );

    shine.addColorStop(0, "rgba(255,255,255,.40)");
    shine.addColorStop(.28, "rgba(255,255,255,.12)");
    shine.addColorStop(1, "rgba(255,255,255,0)");

    c.fillStyle = shine;

    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();

    const shade = c.createRadialGradient(
        x + r * .60, y + r * .48, 0,
        x + r * .40, y + r * .38, r * .92
    );

    shade.addColorStop(0, "rgba(30,15,45,.25)");
    shade.addColorStop(1, "rgba(30,15,45,0)");

    c.fillStyle = shade;

    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();

    c.strokeStyle = info.dark;
    c.globalAlpha = .72;
    c.lineWidth = Math.max(1, r * .055);

    c.beginPath();
    c.arc(x, y, r - r * .015, 0, Math.PI * 2);
    c.stroke();

    c.globalAlpha = 1;
    c.strokeStyle = "rgba(255,255,255,.48)";
    c.lineWidth = Math.max(.7, r * .022);

    c.beginPath();
    c.arc(x, y, r - r * .045, Math.PI * 1.12, Math.PI * 1.78);
    c.stroke();

    c.save();
    c.translate(x, y);
    c.scale(r / info.r, r / info.r);

    drawFace(c, 0, 0, info.r, level, sad);

    c.restore();
    c.restore();
}

function drawPlanet(x, y, level, options = {}) {
    drawPlanetOn(ctx, x, y, level, options.radius || null, options);
}

function drawNextPlanet() {
    nextCtx.clearRect(0, 0, 100, 100);

    if (!levels[nextLevel]) return;

    drawPlanetOn(
        nextCtx,
        50,
        50,
        nextLevel,
        Math.min(29, levels[nextLevel].r),
        {preview: true}
    );
}

function drawAimLine() {
    if (gameOver || dropping || sadPlanet) return;

    const r = levels[nextLevel].r;
    const startY = dangerY - r - 9;
    const endY = floorY - r;

    ctx.save();

    ctx.beginPath();
    ctx.setLineDash([5, 7]);

    const dashOffset = -(gameTime * 32) % 12;
    ctx.lineDashOffset = dashOffset;

    ctx.strokeStyle = "rgba(255,204,126,.55)";
    ctx.lineWidth = 1.4;

    ctx.moveTo(aimX, startY);
    ctx.lineTo(aimX, endY);
    ctx.stroke();

    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;

    drawPlanet(
        aimX,
        startY - r,
        nextLevel,
        {preview: true}
    );

    ctx.restore();
}

function drawBalls() {
    for (const b of balls) {
        drawPlanet(b.x, b.y, b.level, {sad: b === sadPlanet});
    }
}

function drawParticles() {
    for (const p of particles) {
        ctx.save();

        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 7;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

function drawMergeEffects() {
    for (const e of mergeEffects) {
        ctx.save();

        ctx.globalAlpha = e.alpha;
        ctx.strokeStyle = e.color;
        ctx.lineWidth = 2.4 * e.alpha + .3;
        ctx.shadowColor = e.color;
        ctx.shadowBlur = 16;

        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.stroke();

        const g = ctx.createRadialGradient(
            e.x, e.y, 0,
            e.x, e.y, e.radius
        );

        g.addColorStop(0, "rgba(255,255,255,.3)");
        g.addColorStop(.42, e.color + "35");
        g.addColorStop(1, e.color + "00");

        ctx.fillStyle = g;

        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

function drawPopups() {
    ctx.save();

    ctx.textAlign = "center";
    ctx.font = "bold 17px Arial";

    for (const p of popups) {
        ctx.globalAlpha = Math.min(1, p.life / .3);
        ctx.fillStyle = "#ffe8ad";
        ctx.shadowColor = "#ffc45d";
        ctx.shadowBlur = 9;

        ctx.fillText(p.text, p.x, p.y);
    }

    ctx.restore();
}

function drawGameOver() {
    if (!gameOver) return;

    ctx.save();

    ctx.fillStyle = "rgba(5,8,14,.79)";
    ctx.fillRect(0, 0, W, H);

    let x = 35;
    let y = 205;
    let w = W - 70;
    let h = 205;

    ctx.fillStyle = "#10131b";
    ctx.strokeStyle = "#e4ae5b";
    ctx.lineWidth = 1.4;

    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 17);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = "center";
    ctx.fillStyle = "#f3c475";
    ctx.font = "bold 27px Arial";

    ctx.fillText("GAME OVER", W / 2, y + 48);

    ctx.fillStyle = "#f7e9d2";
    ctx.font = "16px Arial";

    ctx.fillText(
        "امتیاز: " + score.toLocaleString("en-US"),
        W / 2,
        y + 88
    );

    ctx.fillStyle = "#eab45e";
    ctx.font = "14px Arial";

    ctx.fillText(
        "رکورد: " + best.toLocaleString("en-US"),
        W / 2,
        y + 116
    );

    ctx.fillStyle = "#eab45e";

    ctx.beginPath();
    ctx.roundRect(x + 35, y + 140, w - 70, 42, 12);
    ctx.fill();

    ctx.fillStyle = "#21140f";
    ctx.font = "bold 15px Arial";

    ctx.fillText("برای بازی دوباره لمس کن", W / 2, y + 166);

    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();
    drawAimLine();
    drawBalls();
    drawParticles();
    drawMergeEffects();
    drawPopups();
    drawGameOver();
}

function loop(timestamp) {
    const dt = lastTime
        ? Math.min((timestamp - lastTime) / 1000, .033)
        : 0;

    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

function restartGame() {
    resetGame();
}

document.getElementById("restartTop").addEventListener("click", restartGame);
document.getElementById("soundButton").addEventListener("click", () => {
    muted = !muted;

    const button = document.getElementById("soundButton");

    button.textContent = muted ? "♪" : "♫";

    button.title = muted
        ? "فعال کردن موسیقی و صداها"
        : "قطع موسیقی و صداها";

    if (!muted) {
        // مرورگر معمولاً اجازه شروع صدا را پس از تعامل کاربر می‌دهد
        if (ensureAudio()) {
            masterGain.gain.cancelScheduledValues(
                audioContext.currentTime
            );

            masterGain.gain.setTargetAtTime(
                1,
                audioContext.currentTime,
                0.03
            );

            startBackgroundMusic();

            // صدای کوتاه تأیید فعال‌شدن
            playTone(500, 0.12, 0.025);
        }
    } else {
        stopBackgroundMusic();

        // قطع سریع موسیقی و تمام افکت‌ها
        if (audioContext && masterGain) {
            masterGain.gain.cancelScheduledValues(
                audioContext.currentTime
            );

            masterGain.gain.setTargetAtTime(
                0,
                audioContext.currentTime,
                0.025
            );
        }
    }
});

/* وضعیت اولیه بازی */
bestAtStart = best;
nextLevel = randomLevel();

updateUI();

requestAnimationFrame(loop);
</script>
